name: Temporary First Person Resume Audit

on:
  push:
    branches:
      - content/first-person-resume-audit
    paths:
      - .github/workflows/tmp-first-person-resume-audit.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/first-person-resume-audit
      - name: Align first-person voice and clean resume source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ar_path = Path('content/portfolio.ar.json')
          ar = json.loads(ar_path.read_text(encoding='utf-8'))
          ar['brand']['role'] = 'مطور برمجيات — أركز على الـBackend وبناء الأنظمة'
          ar['meta']['title'] = 'حيدره مهند | مطور برمجيات — Backend و.NET'
          ar['meta']['description'] = 'البورتفوليو الرسمي لحيدره مهند — مشاريع برمجية وأنظمة Backend ومنتجات عملية ومحتوى تعليمي تقني.'
          ar['education']['description'] = 'أنا طالب في المرحلة الثالثة في قسم هندسة تقنيات الحاسوب بجامعة الكفيل، وحصلت على المركز الأول في المرحلتين الأولى والثانية.'
          ar['resume']['role'] = 'مطور برمجيات — أركز على الـBackend وبناء الأنظمة'
          ar['resume']['summary'] = 'أنا مطور برمجيات أركز على الـBackend وبناء الأنظمة والمنتجات العملية، وطالب في المرحلة الثالثة في هندسة تقنيات الحاسوب بجامعة الكفيل. حصلت على المركز الأول في المرحلتين الأولى والثانية، وأعمل أساساً مع C# و.NET وقواعد البيانات والاختبار، وأتعلم التقنيات المساندة التي يحتاجها كل منتج حتى يصل إلى نتيجة قابلة للاستخدام.'
          ar['resume'].pop('focusTitle', None)
          ar['resume'].pop('focusItems', None)
          ar_path.write_text(json.dumps(ar, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          en_path = Path('content/portfolio.en.json')
          en = json.loads(en_path.read_text(encoding='utf-8'))
          en['education']['description'] = 'I am a third-year Computer Engineering Techniques student at the University of Al-Kafeel, and I ranked first during both my first and second academic years.'
          en['resume']['summary'] = 'I am a backend-focused software developer and a third-year Computer Engineering Techniques student at the University of Al-Kafeel. I ranked first during both my first and second academic years, and I work primarily with C#/.NET, backend systems, databases, and testing while learning the supporting technologies each product needs to reach a usable result.'
          en['resume'].pop('focusTitle', None)
          en['resume'].pop('focusItems', None)
          en_path.write_text(json.dumps(en, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          html = html.replace('البورتفوليو الرسمي لحيدره مهند — مطور برمجيات يركز على الـBackend وبناء الأنظمة والمنتجات العملية.', 'البورتفوليو الرسمي لحيدره مهند — مشاريع برمجية وأنظمة Backend ومنتجات عملية ومحتوى تعليمي تقني.')
          html = html.replace('حيدره مهند | مطور برمجيات يركز على Backend', 'حيدره مهند | مطور برمجيات — Backend و.NET')
          html = html.replace('مطور برمجيات متخصص في Backend', 'مطور برمجيات — أركز على الـBackend وبناء الأنظمة')
          index_path.write_text(html, encoding='utf-8')

          resume_path = Path('resume/index.html')
          html = resume_path.read_text(encoding='utf-8')
          html = html.replace('السيرة المهنية لحيدره مهند — مطور برمجيات يركز على الـBackend وبناء الأنظمة.', 'السيرة المهنية لحيدره مهند — Backend و.NET وبناء الأنظمة والمنتجات العملية.')
          html = html.replace('مطور برمجيات يركز على الـBackend وC# و.NET وبناء منتجات عملية.', 'Backend وC# و.NET وبناء أنظمة ومنتجات عملية.')
          html = html.replace('<p class="resume-role" data-resume="role">مطور برمجيات يركز على الـBackend</p>', '<p class="resume-role" data-resume="role">مطور برمجيات — أركز على الـBackend وبناء الأنظمة</p>')
          html = html.replace('        <p data-resume="summary"></p>\n          <small data-resume="downloadPending"></small>\n        </span>\n', '        <p data-resume="summary"></p>\n')
          if 'downloadPending' in html:
              raise SystemExit('stale downloadPending markup remains')
          resume_path.write_text(html, encoding='utf-8')

          tests_path = Path('tests/portfolio.spec.js')
          tests = tests_path.read_text(encoding='utf-8')
          old_role = "await expect(page.locator('[data-brand=\"role\"]')).toHaveText('مطور برمجيات يركز على الـBackend وبناء الأنظمة');"
          new_role = "await expect(page.locator('[data-brand=\"role\"]')).toHaveText('مطور برمجيات — أركز على الـBackend وبناء الأنظمة');"
          if old_role not in tests:
              raise SystemExit('Arabic home role assertion missing')
          tests = tests.replace(old_role, new_role, 1)
          anchor = "    await expect(page.locator('.education-entry')).toContainText(language === 'ar' ? 'المركز الأول' : 'Ranked 1st');"
          addition = anchor + "\n    await expect(page.locator('[data-resume=\"summary\"]')).toContainText(language === 'ar' ? 'أنا مطور برمجيات أركز' : 'I am a backend-focused software developer');\n    await expect(page.locator('.resume-role')).toContainText(language === 'ar' ? 'أركز على الـBackend' : 'Backend-focused Software Developer');"
          if anchor not in tests:
              raise SystemExit('resume assertion anchor missing')
          tests = tests.replace(anchor, addition, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python -m json.tool content/portfolio.ar.json >/dev/null
          python -m json.tool content/portfolio.en.json >/dev/null
          ! grep -RIn 'data-resume="downloadPending"' resume/index.html
          git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/portfolio.ar.json content/portfolio.en.json index.html resume/index.html tests/portfolio.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "content: use first-person voice across profile and resume"
          git push origin HEAD:content/first-person-resume-audit
