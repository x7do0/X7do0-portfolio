name: Temporary Project Positioning Test Refresh

on:
  push:
    branches:
      - content/refresh-project-positioning
    paths:
      - scripts/update-project-positioning-tests.mjs
      - .github/workflows/tmp-update-project-positioning-tests.yml

permissions:
  contents: write

jobs:
  refresh-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/refresh-project-positioning
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update portfolio tests
        run: node scripts/update-project-positioning-tests.mjs
      - name: Commit test refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/portfolio.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "test: align portfolio QA with current project positioning"
          git push origin HEAD:content/refresh-project-positioning
