name: Temporary Project Positioning Refresh

on:
  push:
    branches:
      - content/refresh-project-positioning
    paths:
      - scripts/refresh-project-positioning.mjs
      - .github/workflows/tmp-project-positioning-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/refresh-project-positioning
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh portfolio project content
        run: node scripts/refresh-project-positioning.mjs
      - name: Commit generated refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "content: refresh Academy and Mahsoob positioning"
          git push origin HEAD:content/refresh-project-positioning
