name: Temporary Portfolio Project Polish

on:
  push:
    branches:
      - polish/project-presentation-and-demos
    paths:
      - scripts/tmp-portfolio-project-polish.mjs
      - .github/workflows/tmp-portfolio-project-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/project-presentation-and-demos
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply project presentation changes
        run: node scripts/tmp-portfolio-project-polish.mjs
      - name: Remove Academy and Masroofi demo implementations
        run: |
          rm -rf demos/coding-academy demos/masroofi
          rm -f assets/projects/coding-academy-current.svg
      - name: Import current Academy screenshots
        run: |
          mkdir -p assets/projects/coding-academy
          for file in 01-home-current 02-courses-current 03-python-overview-current 04-python-lessons-current 05-python-practice-current 06-home-mobile-current; do
            curl -fL "https://raw.githubusercontent.com/x7do0/X7do0-Academy/main/docs/screenshots/${file}.png" -o "assets/projects/coding-academy/${file}.png"
          done
      - name: Verify removed demos have no project-specific references
        run: |
          ! grep -RInE 'demos/(coding-academy|masroofi)|coding-academy-demo|masroofi-demo' --exclude-dir=.git .
          test -d demos/enterprise-workflow
          test -d demos/mahsoob
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Commit project polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "polish: restore Academy presentation and simplify live-project demos"
          git push origin HEAD:polish/project-presentation-and-demos
