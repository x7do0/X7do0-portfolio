name: Temporary Project Test Alignment

on:
  push:
    branches:
      - polish/project-presentation-and-demos
    paths:
      - scripts/tmp-align-project-tests.py
      - .github/workflows/tmp-align-project-tests.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/project-presentation-and-demos
      - name: Align portfolio tests
        run: python3 scripts/tmp-align-project-tests.py
      - name: Verify removed project demos leave no project-specific references
        run: |
          ! grep -RInE 'demos/(coding-academy|masroofi)|coding-academy-demo|masroofi-demo' --exclude-dir=.git .
          test -d demos/enterprise-workflow
          test -d demos/mahsoob
          test "$(find demos -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 2
      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/portfolio.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "test: align project coverage with current presentation"
          git push origin HEAD:polish/project-presentation-and-demos
