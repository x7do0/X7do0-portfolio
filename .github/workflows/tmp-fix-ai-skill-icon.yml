name: Temporary AI Skill Icon Fix

on:
  push:
    branches:
      - fix/ai-skill-icon
    paths:
      - .github/workflows/tmp-fix-ai-skill-icon.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-skill-icon
      - name: Fix AI skill icon mapping and regression QA
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          old = 'const iconNames = ["backend", "database", "quality", "git", "projects"];'
          new = 'const iconNames = ["backend", "database", "quality", "git", "projects", "ai"];'
          if old not in text:
              raise SystemExit('Expected skill icon mapping not found')
          text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          tests = Path('tests/portfolio.spec.js')
          text = tests.read_text(encoding='utf-8')
          ar_anchor = "  await expect(page.locator('.skills-showcase')).toContainText('توظيف الذكاء الاصطناعي في هندسة البرمجيات');"
          ar_new = ar_anchor + "\n  await expect(page.locator('.skills-showcase')).not.toContainText('undefined');"
          if ar_anchor not in text:
              raise SystemExit('Arabic skills assertion anchor not found')
          text = text.replace(ar_anchor, ar_new, 1)

          en_anchor = "  await expect(page.locator('.skills-showcase')).toContainText('AI-Augmented Software Engineering');"
          en_new = en_anchor + "\n  await expect(page.locator('.skills-showcase')).not.toContainText('undefined');"
          if en_anchor not in text:
              raise SystemExit('English skills assertion anchor not found')
          text = text.replace(en_anchor, en_new, 1)
          tests.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/portfolio.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: render AI skill icon correctly"
          git push origin HEAD:fix/ai-skill-icon
