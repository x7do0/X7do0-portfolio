name: Portfolio QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        run: npm run test:e2e

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-qa-${{ github.sha }}
          if-no-files-found: warn
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 7
