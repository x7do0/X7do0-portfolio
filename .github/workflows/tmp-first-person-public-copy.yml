name: Temporary First Person Public Copy

on:
  push:
    branches:
      - content/first-person-resume-audit
    paths:
      - .github/workflows/tmp-first-person-public-copy.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/first-person-resume-audit
      - name: Restore homepage focus and personalize public section copy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ar_path = Path('content/portfolio.ar.json')
          ar = json.loads(ar_path.read_text(encoding='utf-8'))
          ar['hero']['description'] = 'أبني أنظمة وتطبيقات عملية من الفكرة والمتطلبات إلى منتج قابل للاستخدام، وأركز على الـBackend وجودة التنفيذ والقدرة على التكيّف مع احتياجات كل مشروع.'
          ar['projectsSection']['description'] = 'أعرض هنا أربعة مشاريع ومنتجات عملية في سياقات مختلفة، من أنظمة الأعمال إلى التعليم والمال ونقاط البيع. يمكنك استكشاف فكرة كل مشروع، تجربة المحاكاة المتاحة، أو فتح تفاصيله.'
          ar['skillsSection']['description'] = 'أجمع بين قدرات هندسية مترابطة لبناء الأنظمة والتحقق منها وتسليمها، مع تركيز أساسي على الـBackend وC# و.NET.'
          ar['resume']['focusTitle'] = 'ما أركز عليه'
          ar['resume']['focusItems'] = [
              'أركز على الـBackend باستخدام C# و.NET',
              'أعمل مع قواعد البيانات والاختبار وتصحيح الأخطاء',
              'أحوّل المتطلبات إلى منتجات عملية قابلة للاستخدام'
          ]
          ar_path.write_text(json.dumps(ar, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          en_path = Path('content/portfolio.en.json')
          en = json.loads(en_path.read_text(encoding='utf-8'))
          en['projectsSection']['description'] = 'I present four projects and products across different contexts, from business systems to education, personal finance, and point of sale. You can explore each idea, try the available simulation, or open its project page.'
          en['skillsSection']['description'] = 'I combine connected engineering capabilities to build, verify, and deliver software systems, with a primary focus on backend engineering, C#, and .NET.'
          en['resume']['focusTitle'] = 'What I focus on'
          en['resume']['focusItems'] = [
              'I focus on backend engineering with C# and .NET',
              'I work with databases, testing, and debugging',
              'I turn requirements into practical, usable products'
          ]
          en_path.write_text(json.dumps(en, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          tests_path = Path('tests/portfolio.spec.js')
          tests = tests_path.read_text(encoding='utf-8')
          anchor = "  await expect(page.locator('#full-resume-link')).toHaveAttribute('href', './resume/');"
          addition = "  await expect(page.locator('#resume-focus li')).toHaveCount(3);\n  await expect(page.locator('#resume-focus')).toContainText('أركز على الـBackend');\n" + anchor
          if anchor not in tests:
              raise SystemExit('home resume focus anchor missing')
          tests = tests.replace(anchor, addition, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

          python -m json.tool content/portfolio.ar.json >/dev/null
          python -m json.tool content/portfolio.en.json >/dev/null
          git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/portfolio.ar.json content/portfolio.en.json tests/portfolio.spec.js
          git diff --cached --quiet && exit 0
          git commit -m "content: keep public portfolio narration in first person"
          git push origin HEAD:content/first-person-resume-audit
