<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <script src="./boot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070a">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/X7do0-portfolio/assets/x7do0-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/X7do0-portfolio/styles.css">
  <title>الصفحة غير موجودة | x7do0</title>
  <style>
    .not-found{min-height:100svh;display:grid;place-items:center;padding:40px}.not-found__inner{width:min(880px,100%);text-align:center}
    .not-found__code{display:block;color:var(--accent);font-family:var(--font-en);font-size:clamp(8rem,28vw,22rem);font-weight:500;letter-spacing:-.1em;line-height:.7;opacity:.24}
    .not-found h1{margin:70px 0 0;font-size:clamp(2.5rem,7vw,5.5rem);font-weight:500;letter-spacing:-.05em}
    .not-found p{margin:20px auto 0;max-width:48ch;color:var(--muted)}
    .not-found .button{margin-top:36px}
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found__inner">
      <span class="not-found__code" aria-hidden="true">404</span>
      <h1 id="title">الصفحة غير موجودة</h1>
      <p id="description">لم يتم العثور على الصفحة المطلوبة، لكن يمكنك العودة إلى معرض الأعمال ومتابعة الاستكشاف.</p>
      <a class="button button--primary" href="/X7do0-portfolio/" id="action">العودة إلى الرئيسية</a>
    </div>
  </main>
  <script src="./navigation.js"></script>
  <script>
    const english = document.documentElement.lang === "en";
    if (english) {
      document.title = "Page not found | x7do0";
      document.querySelector("#title").textContent = "Page not found";
      document.querySelector("#description").textContent = "The page you requested could not be found. Return to the portfolio and keep exploring.";
      const action = document.querySelector("#action");
      action.textContent = "Back to home";
      action.href = "/X7do0-portfolio/?lang=en";
    }
    window.portfolioReady?.();
  </script>
</body>
</html>
